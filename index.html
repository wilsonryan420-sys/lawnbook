<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Lawncare Routebook</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one working page. Header with a Driver / Accountant switch, a one-line summary, then a spreadsheet-style grid that scrolls sideways on phones. */
:root{
  --bg:#f2f3ee;
  --surface:#fbfbf8;
  --head:#e8ebe0;
  --line:#d5d9ca;
  --fg:#1c2318;
  --muted:#667060;
  --accent:#2d6a2f;
  --accent-fg:#ffffff;
  --accent-soft:#dcebd3;
  --route-soft:#e7f0df;
  --warn:#8f6100;
  --warn-soft:#f5e8c9;
  --bad:#a3372a;
  --bad-soft:#f6dcd6;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-num:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11150e;--surface:#191e15;--head:#222a1d;--line:#2d3626;--fg:#e5e9de;--muted:#98a28c;
    --accent:#86c981;--accent-fg:#0e1a0c;--accent-soft:#243620;--route-soft:#1c2a19;
    --warn:#e3b556;--warn-soft:#352b10;--bad:#f0907f;--bad-soft:#3b201b;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11150e;--surface:#191e15;--head:#222a1d;--line:#2d3626;--fg:#e5e9de;--muted:#98a28c;
  --accent:#86c981;--accent-fg:#0e1a0c;--accent-soft:#243620;--route-soft:#1c2a19;
  --warn:#e3b556;--warn-soft:#352b10;--bad:#f0907f;--bad-soft:#3b201b;
  color-scheme:dark;
}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.45}
*{box-sizing:border-box}
[hidden]{display:none!important}
.wrap{max-width:1280px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
.eyebrow{margin:0;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{margin:2px 0 0;font-size:26px;line-height:1.1;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
.switch{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.switch a{padding:9px 18px;color:var(--fg);text-decoration:none;font-weight:500}
.switch a+a{border-left:1px solid var(--line)}
.switch a[aria-current="page"]{background:var(--accent);color:var(--accent-fg)}
.help{margin:14px 0 0;max-width:65ch;color:var(--muted)}
.banner{margin:14px 0 0;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:10px 12px;background:var(--warn-soft);color:var(--warn);border-radius:6px;font-weight:500}
.banner span{min-width:0}
.summary{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 32px;margin:18px 0 12px}
.stat{display:flex;flex-direction:column;gap:1px;min-width:0}
.stat b{font-family:var(--font-num);font-weight:500;font-size:20px;font-variant-numeric:tabular-nums}
.stat small{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stat.bad b{color:var(--bad)}
.spacer{flex:1}
.routenote{font-size:12px;color:var(--muted)}
.gridwrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
table{border-collapse:separate;border-spacing:0;width:100%}
th,td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0;vertical-align:top;text-align:left}
tr:last-child td{border-bottom:0}
th:last-child,td:last-child{border-right:0}
th{padding:9px 10px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);background:var(--head);font-weight:600;white-space:nowrap}
.rn{position:sticky;left:0;z-index:1;width:52px;min-width:52px;text-align:center;font-family:var(--font-num);color:var(--muted);background:var(--head);padding-top:10px}
.sticky{position:sticky;left:52px;z-index:1;background:var(--surface)}
th.sticky{background:var(--head)}
td.cell{padding:6px}
td.num{text-align:right}
input,textarea,select{font:inherit;color:var(--fg)}
td input,td textarea{display:block;width:100%;border:0;background:transparent;padding:8px 10px;border-radius:0;resize:none}
td textarea{min-height:56px}
td input::placeholder,td textarea::placeholder{color:var(--muted);opacity:.75}
td input.money{text-align:right;font-family:var(--font-num);font-variant-numeric:tabular-nums}
td input:focus-visible,td textarea:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;background:var(--bg)}
select{width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:4px;background:var(--surface)}
select[data-v="ok"]{background:var(--accent-soft);color:var(--accent);border-color:transparent;font-weight:500}
select[data-v="warn"]{background:var(--warn-soft);color:var(--warn);border-color:transparent;font-weight:500}
select:focus-visible,.btn:focus-visible,.switch a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chip{display:inline-block;padding:5px 9px;border-radius:4px;border:1px solid var(--line);font-size:13px;white-space:nowrap}
.chip[data-v="ok"]{background:var(--accent-soft);color:var(--accent);border-color:transparent;font-weight:500}
.chip[data-v="warn"]{background:var(--warn-soft);color:var(--warn);border-color:transparent;font-weight:500}
.bal{font-family:var(--font-num);font-variant-numeric:tabular-nums;text-align:right;padding:15px 12px 0;white-space:nowrap;font-weight:500}
.bal[data-v="bad"]{color:var(--bad)}
.bal[data-v="ok"]{color:var(--accent)}
.bal[data-v="none"]{color:var(--muted)}
.btn{display:inline-block;font:inherit;font-size:13px;font-weight:500;padding:6px 11px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:4px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.off{color:var(--muted);cursor:default;opacity:.6}
.btn.off:hover{border-color:var(--line)}
.btn.small{font-size:12px;padding:3px 8px;margin-top:4px}
.btn.rm{color:var(--bad);padding:5px 9px}
.mapcell{padding:8px;vertical-align:top}
.actions{margin-top:12px}
.empty{padding:36px 16px;border:1px dashed var(--line);border-radius:6px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-size:16px;margin-bottom:4px}
.stat.warn b{color:var(--warn)}
.notice{margin:14px 0 0;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:10px 12px;background:var(--accent-soft);color:var(--accent);border-radius:6px;font-weight:500}
.flag{display:flex;align-items:flex-start;gap:8px;padding:0 8px 8px;font-size:12px;color:var(--warn)}
.flag span{flex:1;min-width:0}
.flag .btn.small{margin-top:0}
.importbox{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.lbl{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
textarea.paste{width:100%;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:10px 12px;font-family:var(--font-num);font-size:12.5px;line-height:1.5;resize:vertical;min-height:140px;white-space:pre;overflow:auto}
textarea.paste:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.row-actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.btn:disabled{opacity:.5;cursor:default}
.issue{padding:6px 10px;font-size:12.5px;color:var(--warn)}
.issue::before{content:"!";display:inline-block;width:15px;height:15px;margin-right:6px;border-radius:50%;background:var(--warn);color:var(--surface);font-weight:700;font-size:11px;line-height:15px;text-align:center}
td.chk .chip{margin:7px 10px}
td input[type=checkbox]{display:inline-block;width:18px;height:18px;margin:0;vertical-align:middle}
td.inc{padding:10px 8px;white-space:nowrap;text-align:center}
.rn-n{font-family:var(--font-num);color:var(--muted);margin-left:6px}
tr.skip td{opacity:.5}
.scan-top{margin-top:6px}
.importtable{margin-top:12px}
td input.stack{border-top:1px solid var(--line)}
.routepanel{margin:0 0 14px;padding:14px;border:1px solid var(--line);border-radius:6px;background:var(--surface);display:flex;flex-direction:column;gap:12px}
.routepanel h2{margin:0;font-size:15px;font-weight:600}
.rp-help{margin:0;color:var(--muted);font-size:13px;max-width:65ch}
.rp-controls{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 12px}
.rp-controls label{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1 1 200px;max-width:320px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.rp-controls label.inline{flex:0 1 auto;flex-direction:row;align-items:center;gap:8px;font-size:13px;letter-spacing:0;text-transform:none;font-weight:400;color:var(--fg);padding-bottom:7px}
.rp-controls input[type=checkbox]{width:18px;height:18px;margin:0}
.rp-actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.rp-note{margin:0;font-size:12.5px;color:var(--muted)}
.rp-stops{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
.rp-stops li{padding:3px 8px;border:1px solid var(--line);border-radius:4px;background:var(--bg);font-size:12.5px}
.rp-stops li b{font-family:var(--font-num);font-weight:500;color:var(--accent);margin-right:5px}
.rp-saved{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.rp-saved input[type=text]{flex:1 1 220px;max-width:340px;min-width:0;font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:4px;background:var(--surface);color:var(--fg)}
.rp-saved input[type=text]:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.chipbtn{display:inline-flex;border:1px solid var(--line);border-radius:4px;background:var(--bg);overflow:hidden}
.chipbtn button{font:inherit;font-size:13px;color:var(--fg);background:transparent;border:0;padding:6px 10px;cursor:pointer}
.chipbtn button+button{border-left:1px solid var(--line);color:var(--bad);padding:6px 9px}
.chipbtn button:hover{background:var(--accent-soft)}
.chipbtn button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
tr.inroute td{background:var(--route-soft)}
.stopn{display:block;font-size:10px;font-weight:600;color:var(--accent);line-height:1.2;margin-top:2px}
td.ord{white-space:nowrap;padding:6px}
td.ord .btn{margin:0 2px;padding:3px 7px;min-width:28px}
.rp-controls input[type=date],.rp-controls input[type=search]{font:inherit;padding:7px 8px;border:1px solid var(--line);border-radius:4px;background:var(--surface);color:var(--fg);width:100%;min-width:0}
.rp-controls input[type=date]:focus-visible,.rp-controls input[type=search]:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.gridwrap.tall{max-height:68vh;overflow:auto}
.logtbl th{position:sticky;top:0;z-index:2}
.logtbl td{padding:7px 10px;white-space:nowrap;font-size:13px}
.logtbl td.wrapcell{white-space:normal;min-width:220px;max-width:320px}
.logtbl td.mono{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.logtbl td.money{font-family:var(--font-num);font-variant-numeric:tabular-nums;text-align:right}
.logtbl tbody tr:nth-child(even) td{background:var(--bg)}
.logtbl .chip{padding:2px 8px;font-size:12px}
@media (max-width:640px){
  .rn,.sticky{position:static}
  .switch a{padding:9px 12px}
  h1{font-size:22px}
}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<div class="wrap">
  <header class="top">
    <div>
      <p class="eyebrow">Lawncare</p>
      <h1>Routebook</h1>
    </div>
    <nav class="switch" aria-label="Choose a view">
      <a href="#driver" id="nav-driver">Driver</a>
      <a href="#accountant" id="nav-accountant">Accountant</a>
      <a href="#import" id="nav-import">Import</a>
      <a href="#log" id="nav-log">Log</a>
    </nav>
  </header>
  <p class="help" id="help"></p>
  <div class="banner" id="banner" hidden>
    <span>These are example customers so you can see how it works. Clear them to start your own list.</span>
    <button class="btn" type="button" data-act="clear" id="clear-examples">Clear examples</button>
  </div>
  <div class="notice" id="notice" role="status" hidden>
    <span id="notice-text"></span>
    <button class="btn small" type="button" data-act="close-notice">Dismiss</button>
  </div>
  <div class="summary" id="summary"></div>
  <section class="routepanel" id="weekpanel" aria-label="Save week" hidden></section>
  <section class="routepanel" id="routepanel" aria-label="Route builder" hidden></section>
  <div id="stage"></div>
  <div class="actions" id="actions"><button class="btn primary" type="button" data-act="add" id="add-customer">+ Add customer</button></div>
</div>

<script>
(function(){
  var KEY = 'lawn-routebook-v1';
  var JOBS = ['Mow','Mow + edge','Mow + blow','Mow, edge + blow','Leaf cleanup','Fertilize','Other'];
  var STATUS = ['Pending','Done','Skipped: rain','Skipped: gate locked','Skipped: customer asked'];
  var PAY = ['Unpaid','Cash','Check','Card','Prepaid'];

  function uid(){ return 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
  function blank(){
    return {id:uid(),name:'',serviceAddr:'',billingAddr:'',job:JOBS[0],status:'Pending',pay:'Unpaid',driverNotes:'',owed:null,paid:null,paidDate:'',acctNotes:'',flag:'',rate:null,freq:'',phone:'',email:'',time:'',doneDate:''};
  }
  function ex(o){
    var r = blank(); for (var k in o) r[k] = o[k];
    if (r.rate == null && r.owed != null){ r.rate = r.owed; r.freq = 'per visit'; }
    if (r.status === 'Done' && !r.doneDate) r.doneDate = r.paidDate || '2026-11-10';
    return r;
  }

  function examples(){
    return [
      ex({name:'Marisol Vega',serviceAddr:'14210 Larkspur Ln, Bothell, WA 98012',job:'Mow + edge',status:'Done',pay:'Cash',driverNotes:'Gate code 4471. Dog stays inside.',owed:55,paid:55,paidDate:'2026-11-09'}),
      ex({name:'Tom Brandvold',serviceAddr:'2231 Alder Creek Rd, Bothell, WA 98011',billingAddr:'PO Box 884, Mill Creek, WA 98012',job:'Mow',driverNotes:'Park on the street. Back yard first.',owed:45}),
      ex({name:'Priya Anand',serviceAddr:'905 Fir Ridge Ct, Bothell, WA 98021',job:'Mow, edge + blow',owed:70}),
      ex({name:'Northgate Dental',serviceAddr:'1760 Commerce Way, Bothell, WA 98011',billingAddr:'Accounts Payable, 1760 Commerce Way Ste 200, Bothell, WA 98011',job:'Leaf cleanup',status:'Skipped: rain',driverNotes:'Reschedule for Friday.',owed:120,acctNotes:'Net 30 terms.'}),
      ex({name:'Janelle Whitcomb',serviceAddr:'7712 Spruce Hollow Dr, Bothell, WA 98012',job:'Mow',status:'Done',pay:'Card',owed:45,paid:45,paidDate:'2026-11-10'}),
      ex({name:'Ray Okonkwo',serviceAddr:'3318 Cedar Bluff Way, Bothell, WA 98021',billingAddr:'Okonkwo Rentals, 410 Pine St, Everett, WA 98201',job:'Mow + edge',status:'Done',driverNotes:'Not home. Send him an invoice.',owed:55,acctNotes:'Invoice sent by mail.'})
    ];
  }

  function load(){
    try{
      var s = localStorage.getItem(KEY);
      if (s){ var o = JSON.parse(s); if (o && Array.isArray(o.rows)) return o; }
    }catch(e){}
    return null;
  }
  var state = load() || {examples:true, rows:examples()};
  if (!Array.isArray(state.log)) state.log = [];
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  var fmt = new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'});
  function money(n){ return fmt.format(n || 0); }
  function today(){
    var d = new Date();
    var m = String(d.getMonth()+1).padStart(2,'0');
    var day = String(d.getDate()).padStart(2,'0');
    return d.getFullYear() + '-' + m + '-' + day;
  }
  function view(){
    var h = location.hash;
    return h === '#accountant' ? 'accountant' : (h === '#import' ? 'import' : (h === '#log' ? 'log' : 'driver'));
  }
  function flagHtml(r){
    return r.flag ? '<div class="flag"><span>Check: '+esc(r.flag)+'</span><button class="btn small" type="button" data-act="dismiss">Dismiss</button></div>' : '';
  }
  function flaggedStat(){
    var n = state.rows.filter(function(r){ return r.flag; }).length;
    return n ? stat('Need a look', n, 'warn') : '';
  }
  function find(id){ for (var i=0;i<state.rows.length;i++) if (state.rows[i].id === id) return state.rows[i]; return null; }

  function keyFor(f, v){
    if (f === 'status') return v === 'Done' ? 'ok' : (v === 'Pending' ? 'none' : 'warn');
    if (f === 'pay') return (v === 'Unpaid' || !v) ? 'none' : 'ok';
    return 'none';
  }

  /* ---------- cell builders ---------- */
  function ta(f, val, ph){ return '<textarea data-f="'+f+'" rows="2" placeholder="'+esc(ph)+'">'+esc(val)+'</textarea>'; }
  function inp(f, val, ph, type, cls){
    return '<input'+(cls?' class="'+cls+'"':'')+' data-f="'+f+'" type="'+(type||'text')+'" value="'+esc(val)+'" placeholder="'+esc(ph||'')+'">';
  }
  function moneyInp(f, val, ph){
    return '<input class="money" data-f="'+f+'" type="number" min="0" step="0.01" inputmode="decimal" value="'+(val == null ? '' : esc(val))+'" placeholder="'+esc(ph||'0.00')+'">';
  }
  function sel(f, opts, val){
    var h = '<select data-f="'+f+'" data-v="'+keyFor(f,val)+'">';
    for (var i=0;i<opts.length;i++) h += '<option'+(opts[i]===val?' selected':'')+'>'+esc(opts[i])+'</option>';
    return h + '</select>';
  }
  function mapHref(addr){
    return 'https://www.google.com/maps/dir/?api=1&travelmode=driving&destination=' + encodeURIComponent(addr);
  }
  function mapHtml(r){
    if (r.serviceAddr && r.serviceAddr.trim())
      return '<a class="btn" target="_blank" rel="noopener" href="'+mapHref(r.serviceAddr.trim())+'">Directions</a>';
    return '<span class="btn off">Directions</span>';
  }

  /* ---------- tables ---------- */
  function driverTable(){
    var h = '<thead><tr><th class="rn">#</th><th class="sticky" style="min-width:170px">Customer</th><th>Order</th><th style="min-width:230px">Service address</th><th>Map</th><th style="min-width:150px">Job</th><th style="min-width:190px">Yard done?</th><th style="min-width:150px">Date done</th><th style="min-width:130px">Payment given</th><th style="min-width:100px">Time</th><th style="min-width:140px">Phone</th><th style="min-width:230px">Driver notes</th><th></th></tr></thead><tbody>';
    state.rows.forEach(function(r,i){
      h += '<tr data-id="'+r.id+'">'
        + '<td class="rn">'+(i+1)+'<span class="stopn"></span></td>'
        + '<td class="sticky">'+inp('name',r.name,'Customer name')+flagHtml(r)+'</td>'
        + '<td class="ord"><button class="btn" type="button" data-act="up" aria-label="Move up"'+(i===0?' disabled':'')+'>&#9650;</button><button class="btn" type="button" data-act="down" aria-label="Move down"'+(i===state.rows.length-1?' disabled':'')+'>&#9660;</button></td>'
        + '<td>'+ta('serviceAddr',r.serviceAddr,'Street, city, ZIP')+'</td>'
        + '<td class="mapcell">'+mapHtml(r)+'</td>'
        + '<td class="cell">'+sel('job',JOBS,r.job)+'</td>'
        + '<td class="cell">'+sel('status',STATUS,r.status)+'</td>'
        + '<td>'+inp('doneDate',r.doneDate,'','date')+'</td>'
        + '<td class="cell">'+sel('pay',PAY,r.pay)+'</td>'
        + '<td>'+inp('time',r.time,'e.g. 30 min')+'</td>'
        + '<td>'+inp('phone',r.phone,'Phone','tel')+'</td>'
        + '<td>'+ta('driverNotes',r.driverNotes,'Gate codes, dogs, anything to remember')+'</td>'
        + '<td class="cell"><button class="btn rm" type="button" data-act="rm" aria-label="Remove customer">&times;</button></td>'
        + '</tr>';
    });
    return h + '</tbody>';
  }
  function acctTable(){
    var h = '<thead><tr><th class="rn">#</th><th class="sticky" style="min-width:170px">Customer</th><th style="min-width:230px">Billing address</th><th>Yard</th><th>Paid at yard</th><th style="min-width:150px">Rate</th><th style="min-width:120px">Amount owed</th><th style="min-width:150px">Amount paid</th><th style="min-width:150px">Date paid</th><th style="min-width:120px">Balance</th><th style="min-width:200px">Contact</th><th style="min-width:230px">Accountant notes</th></tr></thead><tbody>';
    state.rows.forEach(function(r,i){

  /* ---------- route builder ---------- */

  /* every row from start to end, in the order the driver will go */

  /* ---------- weekly log ---------- */

      } else {
        h += '<div class="rp-controls"><label>Week ending<input type="date" id="wk-date" value="' + esc(weekDate || today()) + '"></label></div>'
          + (c.noDate ? '<p class="rp-note">' + c.noDate + ' done ' + (c.noDate === 1 ? 'yard has' : 'yards have') + ' no date. They are logged with the week ending date.</p>' : '')
          + '<div class="rp-actions"><button class="btn primary" type="button" id="wk-save" data-act="wk-save">Save to log and reset week</button>'
          + '<button class="btn" type="button" data-act="wk-cancel">Cancel</button></div>';
      }
    } else if (state.lastSave){
      var s = state.lastSave;
      h = '<div class="rp-actions"><span class="rp-note">Last saved: week ending ' + esc(niceDate(s.weekEnding)) + ', ' + s.count + (s.count === 1 ? ' line' : ' lines') + ' added to the log.</span>'
        + '<a class="btn" href="#log">View log</a>'
        + '<button class="btn" type="button" data-act="wk-undo">Undo last save</button></div>';
    }
    box.innerHTML = h;
    box.hidden = !h;
  }
  $('weekpanel').addEventListener('input', function(e){ if (e.target.id === 'wk-date') weekDate = e.target.value; });
  $('weekpanel').addEventListener('change', function(e){ if (e.target.id === 'wk-date') weekDate = e.target.value; });

  function saveWeek(){
    if (state.examples || !state.rows.length) return;
    var we = ymd(weekDate) ? weekDate : today(), batch = uid(), prev = [], added = [], nd = 0, nn = 0;
    state.rows.forEach(function(r){
      var done = r.status === 'Done';
      var reason = done ? '' : (r.status.indexOf('Skipped') === 0 ? r.status.replace(/^Skipped:\s*/, '') : 'Not visited');
      if (done) nd++; else nn++;
      added.push({id:uid(), batch:batch, weekEnding:we, name:r.name, serviceAddr:r.serviceAddr, job:r.job,
        done:done ? 'Done' : 'Not done', doneDate:done ? (r.doneDate || we) : '', reason:reason,
        payment:r.pay, rate:r.rate, freq:r.freq, owed:r.owed, paid:r.paid, paidDate:r.paidDate, notes:r.driverNotes});
      prev.push({id:r.id, status:r.status, pay:r.pay, doneDate:r.doneDate});
      r.status = 'Pending'; r.pay = 'Unpaid'; r.doneDate = '';
    });
    state.log = state.log.concat(added);
    state.lastSave = {batch:batch, weekEnding:we, count:added.length, prev:prev};
    weekOpen = false;
    save();
    notice = 'Week saved. ' + nd + ' done and ' + nn + ' not done were added to the log, and every yard is back to Pending.';
    render();
  }
  function undoWeek(){
    var s = state.lastSave; if (!s) return;
    var map = {}; state.rows.forEach(function(r){ map[r.id] = r; });
    s.prev.forEach(function(p){
      var r = map[p.id]; if (r){ r.status = p.status; r.pay = p.pay; r.doneDate = p.doneDate; }
    });
    state.log = state.log.filter(function(x){ return x.batch !== s.batch; });
    state.lastSave = null;
    save();
    notice = 'Last save undone. The week is back the way it was.';
    render();
  }

  function logItems(){
    var q = norm(logFilter);
    var items = state.log.map(function(x, i){ return {x:x, i:i}; });
    items.sort(function(a, b){ return a.x.weekEnding < b.x.weekEnding ? 1 : (a.x.weekEnding > b.x.weekEnding ? -1 : a.i - b.i); });
    return items.map(function(o){ return o.x; }).filter(function(x){
      return !q || norm([x.name, x.serviceAddr, x.weekEnding, x.done, x.reason, x.payment].join(' ')).indexOf(q) >= 0;
    });
  }
  function moneyOrBlank(n){ return n == null ? '' : money(n); }
  function logTableHtml(){
    var rows = logItems();
    if (!rows.length) return '<div class="empty"><b>No matches</b>Nothing in the log matches that search.</div>';
    var h = '<div class="gridwrap tall"><table class="logtbl"><thead><tr>' + LOG_HEAD.map(function(t){ return '<th>' + t + '</th>'; }).join('') + '</tr></thead><tbody>';
    rows.forEach(function(x){
      h += '<tr>'
        + '<td class="mono">' + esc(x.weekEnding) + '</td>'
        + '<td>' + esc(x.name) + '</td>'
        + '<td class="wrapcell">' + esc(x.serviceAddr) + '</td>'
        + '<td>' + esc(x.job) + '</td>'
        + '<td><span class="chip" data-v="' + (x.done === 'Done' ? 'ok' : 'warn') + '">' + esc(x.done) + '</span></td>'
        + '<td class="mono">' + esc(x.doneDate) + '</td>'
        + '<td>' + esc(x.reason) + '</td>'
        + '<td>' + esc(x.payment) + '</td>'
        + '<td class="money">' + moneyOrBlank(x.rate) + '</td>'
        + '<td>' + esc(x.freq) + '</td>'
        + '<td class="money">' + moneyOrBlank(x.owed) + '</td>'
        + '<td class="money">' + moneyOrBlank(x.paid) + '</td>'
        + '<td class="mono">' + esc(x.paidDate) + '</td>'
        + '<td class="wrapcell">' + esc(x.notes) + '</td>'
        + '</tr>';
    });
    return h + '</tbody></table></div>';
  }
  function logHtml(){
    var n = state.log.length;
    if (!n) return '<div class="empty"><b>Nothing logged yet</b>At the end of the week, press Save week on the Driver tab. Each customer is added here as done or not done, with the date completed.</div>';
    var weeks = {}; state.log.forEach(function(x){ weeks[x.weekEnding] = 1; });
    return '<div class="summary">' + stat('Lines logged', n) + stat('Weeks saved', Object.keys(weeks).length)
      + '<div class="spacer"></div><button class="btn primary" type="button" data-act="log-export">Download Excel</button></div>'
      + '<p class="rp-note" id="logmsg" role="status">' + esc(logMsg) + '</p>'
      + '<div class="rp-controls" style="margin:6px 0 10px"><label>Find a customer<input type="search" id="log-find" placeholder="Name, address or week" value="' + esc(logFilter) + '"></label></div>'
      + '<div id="logtable">' + logTableHtml() + '</div>';
  }
  function onLogEdit(e){
    if (e.target.id !== 'log-find') return;
    logFilter = e.target.value;
    var t = $('logtable'); if (t) t.innerHTML = logTableHtml();
  }
  function setLogMsg(t){ logMsg = t; var m = $('logmsg'); if (m) m.textContent = t; }

  async function exportLog(){
    if (typeof XLSX === 'undefined'){ setLogMsg('The Excel tool did not load. Reload the page and try again.'); return; }
    var dl = null;
    try{ dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; }catch(e){ dl = null; }
    if (!dl){ setLogMsg('Saving files is not available in this view. Open the Routebook in Claude to download it.'); return; }
    try{
      var aoa = [LOG_HEAD];
      state.log.forEach(function(x){
        aoa.push([ymd(x.weekEnding) || x.weekEnding || '', x.name, x.serviceAddr, x.job, x.done, ymd(x.doneDate) || '', x.reason, x.payment,
          x.rate == null ? '' : x.rate, x.freq, x.owed == null ? '' : x.owed, x.paid == null ? '' : x.paid, ymd(x.paidDate) || '', x.notes]);
      });
      var ws = XLSX.utils.aoa_to_sheet(aoa, {cellDates:true});
      for (var r = 1; r < aoa.length; r++){
        [0, 5, 12].forEach(function(c){ var a = ws[XLSX.utils.encode_cell({r:r, c:c})]; if (a && a.t === 'd') a.z = 'yyyy-mm-dd'; });
        [8, 10, 11].forEach(function(c){ var a = ws[XLSX.utils.encode_cell({r:r, c:c})]; if (a && a.t === 'n') a.z = '"$"#,##0.00'; });
      }
      ws['!cols'] = [12, 24, 38, 16, 9, 14, 18, 13, 10, 16, 13, 12, 12, 40].map(function(w){ return {wch:w}; });
      ws['!autofilter'] = {ref:XLSX.utils.encode_range({s:{r:0, c:0}, e:{r:aoa.length - 1, c:LOG_HEAD.length - 1}})};
      var wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Weekly log');
      var out = XLSX.write(wb, {bookType:'xlsx', type:'array'});
      var fn = 'lawncare-log-' + today() + '.xlsx';
      await dl.save({filename:fn, data:new Blob([out])});
      setLogMsg('Saved ' + fn + '.');
    }catch(err){
      var code = err && err.code;
      setLogMsg(code === 'declined' ? 'Download cancelled.'
        : (code === 'rate_limited' ? 'A download prompt is already open. Answer it, then try again.'
        : 'The file could not be saved here.'));
    }
  }

  window.addEventListener('hashchange', render);
  render();
})();
</script>

</body></html>
